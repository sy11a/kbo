# Sanitized example registry (G2-9). The real registry is a machine-local
# overlay at ~/.config/kbo/registry.yaml (override: KBO_REGISTRY or --registry).
machine: example-machine
# Optional: regex extracting a task id from the session's git branch; first
# match becomes the event's `task`. Unset = no task extraction (task stays
# null). Env override: KBO_TASK_PATTERN (ADR-0031).
# taskPattern: 'JIRA-\d+'
# Optional: legislator fleet panel (ADR-0037) — the constitution's VERSION
# file plus roots whose DIRECT children are candidate legislated repos
# (detected by docs/ai/manifest.json). Unset = no panel.
# constitution:
#   versionFile: /home/user/Repository/legislator/skill/VERSION
#   scanRoots:
#     - /home/user/Repository
sources:
  - id: knowledge
    layer: global
    root: /home/user/Knowledge
  - id: cc-skills
    layer: skills
    root: /home/user/.claude/skills
  - id: some-repo
    layer: local
    root: /home/user/Repository/SomeRepo
    # Optional: relative subtrees the note inventory skips — tool fixtures,
    # benchmark data (ADR-0036). Path resolution/kbroot tagging unaffected.
    # excludePaths: [evals, .superpowers]
  - id: some-framework-kb
    layer: framework
    root: /home/user/Repository/SomeRepo/docs/framework
  # A '*' segment expands to one source per matching directory at load time;
  # ids become <id>-<matched-dir> (here e.g. repo-SomeRepo). Future directories
  # are picked up automatically (ADR-0019).
  - id: repo
    layer: local
    root: /home/user/Repository/*/docs
    # Optional: '*'-matched directory names to skip during expansion, e.g.
    # archived repos that are not live knowledge (ADR-0034).
    # exclude: [some-archived-repo]
